<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sale Details — School Supply Store</title><link rel="stylesheet" href="/ui/css/styles.css"></head><body><script src="/ui/js/components.js"></script><script src="/ui/js/feedback.js"></script><script>layout("Sale Details","<div class='card'><div id='detail-status' class='form-message loading'>Loading transaction...</div><div id='detail'></div><div class='form-actions'><a class='button secondary' href='/ui/sales.html'>Back to sales</a></div></div>","Sales","Review the customer, line items, totals, and transaction date.");const box=document.getElementById("detail-status"),root=document.getElementById("detail"),id=new URLSearchParams(location.search).get("id");async function load(){if(!id){UIFeedback.error(box,"The transaction ID is missing.");return}try{UIFeedback.loading(box,"Loading transaction...");const res=await fetch("/sales/"+encodeURIComponent(id));const json=await res.json();if(!res.ok){UIFeedback.error(box,UIFeedback.humanError(res,json));return}const d=json.data;UIFeedback.success(box,"Transaction loaded.");const items=(d.items||[]).map(function(i){return "<tr><td>"+String(i.name).replace(/</g,"&lt;")+"</td><td>"+i.quantity+"</td><td>₱"+Number(i.unitPrice).toFixed(2)+"</td><td>₱"+Number(i.lineTotal).toFixed(2)+"</td></tr>"}).join("");root.innerHTML="<div class='detail-grid'><div class='detail-item'><span>Transaction ID</span><strong>#"+d.id+"</strong></div><div class='detail-item'><span>Customer</span><strong>"+(d.customerId?"#"+d.customerId:"Walk-in")+"</strong></div><div class='detail-item'><span>Total</span><strong>₱"+Number(d.total).toFixed(2)+"</strong></div><div class='detail-item'><span>Date</span><strong>"+new Date(d.transactionDate).toLocaleString()+"</strong></div></div><div class='card' style='margin-top:18px;padding:0;box-shadow:none'><div class='card-title' style='padding:20px 20px 0'><h3>Items</h3></div><div class='table-wrap' style='border:0'><table class='table' style='min-width:0'><thead><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Line Total</th></tr></thead><tbody>"+(items||"<tr><td colspan='4'>No items</td></tr>")+"</tbody></table></div></div>"}catch(e){UIFeedback.error(box,"We could not reach the server. Check your connection and try again.")}}load();</script></body></html>
