<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Details</title><link rel="stylesheet" href="/ui/css/styles.css"></head><body><script src="/ui/js/feedback.js"></script><script src="/ui/js/components.js"></script><script>layout("Customer Details",'<div class="card"><div id="detail-status" class="form-message loading">Loading customer...</div><div id="detail"></div><a class="button secondary" href="/ui/customers.html">Back to Customers</a></div>',"Customers");const box=document.getElementById("detail-status"),root=document.getElementById("detail"),id=new URLSearchParams(location.search).get("id");async function load(){if(!id){UIFeedback.error(box,"We couldn't find that record. The record ID is missing.");return}UIFeedback.loading(box,"Loading customer...");try{const res=await fetch("/customers/"+encodeURIComponent(id));let json={};try{json=await res.json()}catch(_){}if(!res.ok){UIFeedback.error(box,UIFeedback.humanError(res,json));return}UIFeedback.success(box,"Record loaded.");const d=json.data;root.innerHTML="<pre class=\"card\">"+JSON.stringify(d,null,2).replace(/</g,"&lt;")+"</pre>"}catch(e){UIFeedback.error(box,"We could not reach the server. Check your connection and try again.")}}load();</script></body></html>
