<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Details — School Supply Store</title><link rel="stylesheet" href="/ui/css/styles.css"></head><body><script src="/ui/js/components.js"></script><script src="/ui/js/feedback.js"></script><script>layout("Customer Details","<div class='card'><div id='detail-status' class='form-message loading'>Loading customer...</div><div id='detail'></div><div class='form-actions'><a class='button secondary' href='/ui/customers.html'>Back to customers</a></div></div>","Customers","View customer contact information.");const box=document.getElementById("detail-status"),root=document.getElementById("detail"),id=new URLSearchParams(location.search).get("id");async function load(){if(!id){UIFeedback.error(box,"The customer ID is missing.");return}try{UIFeedback.loading(box,"Loading customer...");const res=await fetch("/customers/"+encodeURIComponent(id));const json=await res.json();if(!res.ok){UIFeedback.error(box,UIFeedback.humanError(res,json));return}const d=json.data;UIFeedback.success(box,"Customer loaded.");root.innerHTML="<div class='detail-grid'>"+[["Customer ID","#"+d.id],["Name",d.name],["Contact",d.contact],["Email",d.email||"—"],["Address",d.address||"—"]].map(x=>"<div class='detail-item'><span>"+x[0]+"</span><strong>"+String(x[1]).replace(/</g,"&lt;")+"</strong></div>").join("")+"</div>"}catch(e){UIFeedback.error(box,"We could not reach the server. Check your connection and try again.")}}load();</script></body></html>
