<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details — School Supply Store</title><link rel="stylesheet" href="/ui/css/styles.css"></head><body><script src="/ui/js/components.js"></script><script src="/ui/js/feedback.js"></script><script>layout("Product Details","<div class='card'><div id='detail-status' class='form-message loading'>Loading product...</div><div id='detail'></div><div class='form-actions'><a class='button secondary' href='/ui/products.html'>Back to products</a></div></div>","Products","View the full product record and current stock status.");const box=document.getElementById("detail-status"),root=document.getElementById("detail"),id=new URLSearchParams(location.search).get("id");async function load(){if(!id){UIFeedback.error(box,"The product ID is missing.");return}try{UIFeedback.loading(box,"Loading product...");const res=await fetch("/products/"+encodeURIComponent(id));const json=await res.json();if(!res.ok){UIFeedback.error(box,UIFeedback.humanError(res,json));return}const d=json.data;UIFeedback.success(box,"Product loaded.");root.innerHTML="<div class='detail-grid'>"+[["Product ID","#"+d.id],["Name",d.name],["Category",d.category],["Quantity",Number(d.quantity).toLocaleString()],["Unit Price","₱"+Number(d.unitPrice).toFixed(2)],["Status","<span class='badge "+d.status+"'>"+d.status.replace(/-/g," ")+"</span>"],["Supplier",d.supplierId?"#"+d.supplierId:"No supplier"]].map(x=>"<div class='detail-item'><span>"+x[0]+"</span><strong>"+x[1]+"</strong></div>").join("")+"</div>"}catch(e){UIFeedback.error(box,"We could not reach the server. Check your connection and try again.")}}load();</script></body></html>
