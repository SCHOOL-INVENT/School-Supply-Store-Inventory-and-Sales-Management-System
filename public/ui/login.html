<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In</title><link rel="stylesheet" href="/ui/css/styles.css"></head><body><div class="main login"><div class="card login-card"><h2>Sign in</h2><p class="muted">Use your store account to manage protected actions.</p><div id="form-status" class="form-message"></div><form id="login-form"><div class="field"><label>Username</label><input id="username" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><div class="actions"><button class="button" type="submit">Sign in</button><a class="button secondary" href="/ui/">Cancel</a></div></form></div></div><script src="/ui/js/feedback.js"></script><script>
const form=document.getElementById("login-form"),box=document.getElementById("form-status"),button=form.querySelector("button");
form.addEventListener("submit",async function(e){e.preventDefault();button.disabled=true;UIFeedback.loading(box,"Signing in...");
try{const res=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});let json={};try{json=await res.json()}catch(_){}
if(!res.ok){UIFeedback.error(box,UIFeedback.humanError(res,json));button.disabled=false;return}
localStorage.setItem("schoolSupplyToken",json.data.token);localStorage.setItem("schoolSupplyUser",JSON.stringify(json.data.user));UIFeedback.success(box,"Signed in successfully. Redirecting...");setTimeout(function(){location.href="/ui/"},400)
}catch(e){UIFeedback.error(box,"We could not reach the server. Check your connection and try again.");button.disabled=false}});
</script></body></html>
